# GitHub Actions workflow for testing and continuous integration.
#
# This file performs testing using tox and tox.ini to define and configure the test environments.

name: CI

on:
  push:
    branches:
      - dsi-dev
  pull_request:
    branches:
      - dsi-dev

jobs:

  check:
    name: Check Style
    runs-on: self-hosted

    steps:
      - name: checkout git
        uses: actions/checkout@v4
      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - name: Install dependencies
        run: pip install tox
      - name: Check Style
        run: |
          changedpyfiles=$(git diff --name-only $CI_MERGE_REQUEST_DIFF_BASE_SHA -- '*.py')
          if [ -n "$changedpyfiles" ]; then
            echo "Running ruff on changed python files"
            tox -e check-style -- $changedpyfiles
          else
            echo "No python files changed"
          fi
    
  test:
    name: Unit Tests
    runs-on: self-hosted

    steps:
      - name: checkout git
        uses: actions/checkout@v4
      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - name: Install dependencies
        run: pip install tox
      - name: Run tests
        run: tox -e test

